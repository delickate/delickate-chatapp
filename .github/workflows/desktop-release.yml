name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag matches desktop version
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Release tag $env:GITHUB_REF_NAME does not match desktop version $version."
          }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop
        run: npm run make

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" .\desktop\out\make\squirrel.windows\x64\* --verify-tag --generate-notes
